# wpa_supplicant.conf — plantilla para wifi (w3m-linux)
# Edita SSID/PSK y S40net asociara wlan0 automaticamente al arranque.
# NOTA: la PSK va en claro en este archivo de plantilla; para WPA
# empresarial o mas seguridad usa wpa_passphrase para generar.

ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=0
update_config=1

#network={
#    ssid="TuRed"
#    psk="TuClave"
#    key_mgmt=WPA-PSK
#    scan_ssid=1
#}

network={
    key_mgmt=NONE
}
